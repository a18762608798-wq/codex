#:schema https://developers.openai.com/codex/config-schema.json

# One-time sync of portable Pi preferences; keep Codex's own model and login.
model_reasoning_effort = "xhigh"
# Fresh discovery for the shared paper/book hunter skills.
web_search = "live"

[model_providers.opencode-go]
name = "OpenCode Go"
base_url = "https://opencode.ai/inference/go/openai/v1"
env_key = "OPENCODE_API_KEY"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false

[tui]
alternate_screen = "always"
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 1

[projects."/home/dell/.config/opencode"]
trust_level = "trusted"

[projects."/home/dell/sync"]
trust_level = "trusted"

[projects."/home/dell/.codex"]
trust_level = "trusted"

# Converted from ~/.pi/agent/mcp.json; Pi-specific exposure/transport fields omitted.
[mcp_servers.zotero]
command = "/home/dell/.local/bin/zotero-mcp"
args = ["serve"]
enabled = true
startup_timeout_sec = 120
tool_timeout_sec = 600
# Inherit credentials/proxies by name only; never store their values here.
env_vars = ["ZOTERO_API_KEY", "ZOTERO_LIBRARY_ID", "ZOTERO_LIBRARY_TYPE", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "http_proxy", "https_proxy", "all_proxy"]

[mcp_servers.zotero.env]
FASTMCP_CHECK_FOR_UPDATES = "off"
NO_PROXY = "127.0.0.1,localhost"
ZOTERO_MCP_TOOLSETS = "libraries,search-admin,pdf-geometry,discovery"
ZOTERO_LOCAL = "true"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 60

[mcp_servers.playwright]
command = "/home/dell/.local/share/pi-node/current/bin/node"
args = ["/home/dell/.local/share/pi-node/current/lib/node_modules/@playwright/mcp/cli.js", "--browser", "chromium", "--headless"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 120

[marketplaces.dell-local]
source_type = "local"
source = "/home/dell/.codex/local-marketplace"

[plugins."formula-style@dell-local"]
enabled = true

