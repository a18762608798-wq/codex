#:schema https://developers.openai.com/codex/config-schema.json

# One-time sync of portable Pi preferences; keep Codex's own model and login.
model_reasoning_effort = "xhigh"
# Fresh discovery for the shared paper/book hunter skills.
web_search = "live"

# 全局关闭沙箱：单机可信项目专用，新线程生效
sandbox_mode = "danger-full-access"
approval_policy = "never"

[model_providers.opencode-go]
name = "OpenCode Go"
base_url = "https://opencode.ai/inference/go/openai/v1"
env_key = "OPENCODE_API_KEY"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false

[tui]
alternate_screen = "always"
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 4

[projects."/home/dell/.config/opencode"]
trust_level = "trusted"

[projects."/home/dell/sync"]
trust_level = "trusted"

[projects."/home/dell/.codex"]
trust_level = "trusted"

[projects."/home/dell/.agents"]
trust_level = "trusted"

[projects."/home/dell/.t3"]
trust_level = "trusted"

[projects."/home/dell/development/gamma"]
trust_level = "trusted"

[mcp_servers.zotero]
command = "/home/dell/.local/bin/zotero-mcp"
args = ["serve"]
env_vars = ["ZOTERO_API_KEY", "ZOTERO_LIBRARY_ID", "ZOTERO_LIBRARY_TYPE", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "http_proxy", "https_proxy", "all_proxy"]
startup_timeout_sec = 120.0
tool_timeout_sec = 600.0

[mcp_servers.zotero.env]
FASTMCP_CHECK_FOR_UPDATES = "off"
NO_PROXY = "127.0.0.1,localhost"
ZOTERO_LOCAL = "true"
ZOTERO_MCP_TOOLSETS = "libraries,search-admin,pdf-geometry,discovery"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 60.0
tool_timeout_sec = 60.0

[mcp_servers.gamma]
url = "http://127.0.0.1:9001/mcp"

[mcp_servers.gamma_write]
url = "http://127.0.0.1:9001/mcp-write"

[marketplaces.dell-local]
source_type = "local"
source = "/home/dell/.codex/local-marketplace"

[plugins."formula-style@dell-local"]
enabled = true

[hooks.state]

